services:
  cctv-ui:
    image: ghcr.io/atotmakov/cctv-ui:latest
    container_name: cctv-ui
    ports:
      - "8888:3000"
    volumes:
      # Mount your NAS recording share read-only.
      # Change /volume1/cctv to the actual path on your NAS.
      - /volume1/cctv:/recordings:ro
    environment:
      - NODE_ENV=production
      - STORAGE_TYPE=local
      - STORAGE_PATH=/recordings
      - PORT=3000
    restart: unless-stopped

  # Retention + index.db upkeep (server/maintenance/). Same image as cctv-ui
  # — same codebase, same dependencies, and rebuildIndex.js/dbService.js
  # share a schema contract that must stay in lockstep — but a distinct
  # service: read-write mount (cctv-ui's is :ro, enforced by Docker at the
  # mount level, so this genuinely cannot run inside that container).
  #
  # Runs its own hourly loop in-container (run once immediately, sleep 1h,
  # repeat) instead of being triggered by an external scheduler — DSM's
  # Task Scheduler has no supported/documented way to be provisioned from
  # deploy.ps1 (task creation lives behind an undocumented internal API
  # backed by a SQLite DB shared with unrelated DSM scheduled jobs, not
  # worth the risk to script against). `restart: unless-stopped` plus a
  # normal (non-profile-gated) service means `docker compose up -d` —
  # which deploy.ps1 already runs on every deploy — keeps this alive and
  # self-healing without any extra idempotency logic: an already-running,
  # unchanged container is left alone; a missing/updated one is (re)created.
  cctv-maintenance:
    image: ghcr.io/atotmakov/cctv-ui:latest
    container_name: cctv-maintenance
    restart: unless-stopped
    command: ["sh", "-c", "while true; do node --experimental-sqlite server/maintenance/run.js; sleep 3600; done"]
    volumes:
      - /volume1/cctv:/recordings:rw
    environment:
      - STORAGE_TYPE=local
      - STORAGE_PATH=/recordings
      # Which cameras get managed is determined automatically each run — a
      # camera folder with no native index.db is managed, one with a native
      # index.db is left alone. See CLAUDE.md "Maintenance Service".
      - RETENTION_DAYS=33
